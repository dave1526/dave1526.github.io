<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zsémbmonitor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='12%2C44 16%2C8 44%2C24' fill='%23b08d68'/%3E%3Cpolygon points='88%2C44 84%2C8 56%2C24' fill='%23b08d68'/%3E%3Cpolygon points='19%2C36 21%2C16 35%2C25' fill='%23e5a0a0'/%3E%3Cpolygon points='81%2C36 79%2C16 65%2C25' fill='%23e5a0a0'/%3E%3Cellipse cx='50' cy='60' rx='42' ry='35' fill='%23b08d68'/%3E%3Cpath d='M44 28 L46 38 M50 26 L50 38 M56 28 L54 38' stroke='%236e5238' stroke-width='2.5' stroke-linecap='round'/%3E%3Cellipse cx='50' cy='75' rx='19' ry='13' fill='%23efe2cc'/%3E%3Cellipse cx='36' cy='55' rx='7.5' ry='6.5' fill='%23bfe3f2'/%3E%3Cellipse cx='64' cy='55' rx='7.5' ry='6.5' fill='%23bfe3f2'/%3E%3Cellipse cx='37' cy='57' rx='2.2' ry='4' fill='%231d1d1d'/%3E%3Cellipse cx='63' cy='57' rx='2.2' ry='4' fill='%231d1d1d'/%3E%3Cpolygon points='24%2C41 47%2C41 47%2C59 24%2C50' fill='%23b08d68'/%3E%3Cpolygon points='76%2C41 53%2C41 53%2C59 76%2C50' fill='%23b08d68'/%3E%3Cpath d='M24 50 L47 59 M76 50 L53 59' stroke='%234a3624' stroke-width='2' stroke-linecap='round'/%3E%3Cpolygon points='44.5%2C65 55.5%2C65 50%2C71 ' fill='%23d98a8a'/%3E%3Cpath d='M35 86 Q41 72 50 75 Q59 72 65 86' fill='none' stroke='%233b2a1b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M50 71 L50 75' stroke='%233b2a1b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f2ec;
    --card: #ffffff;
    --text: #2b2420;
    --muted: #6f655d;
    --accent: #b08d68;
    --accent-dark: #8a6a48;
    --border: #e2d9cd;
    --ok: #1f8a3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1815;
      --card: #272220;
      --text: #f0e9e0;
      --muted: #a89d92;
      --border: #3a332e;
      --ok: #4cd16e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: clamp(24px, 6vw, 40px) clamp(16px, 5vw, 32px);
    text-align: center;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
  }
  .logo { width: clamp(80px, 28vw, 120px); height: clamp(80px, 28vw, 120px); margin: 0 auto; }
  .logo svg { display: block; width: 100%; height: 100%; }
  h1 { margin: 12px 0 24px; font-size: clamp(1.5rem, 7vw, 2rem); letter-spacing: -.01em; overflow-wrap: anywhere; }
  form { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  label { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; font-size: 1.05rem; cursor: pointer; }
  input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--accent-dark); cursor: pointer; }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent-dark);
    border: 0;
    border-radius: 10px;
    width: 100%;
    min-height: 48px;
    font-size: 1.05rem;
    padding: 12px 32px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:hover { filter: brightness(1.1); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .result { margin: 0; font-size: clamp(1.05rem, 5vw, 1.3rem); overflow-wrap: anywhere; font-weight: 600; color: var(--ok); }
</style>
</head>
<body>
<main>
  <div class="logo" role="img" aria-label="Zsémbmonitor logó"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="12,44 16,8 44,24" fill="#b08d68"/><polygon points="88,44 84,8 56,24" fill="#b08d68"/><polygon points="19,36 21,16 35,25" fill="#e5a0a0"/><polygon points="81,36 79,16 65,25" fill="#e5a0a0"/><ellipse cx="50" cy="60" rx="42" ry="35" fill="#b08d68"/><path d="M44 28 L46 38 M50 26 L50 38 M56 28 L54 38" stroke="#6e5238" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="50" cy="75" rx="19" ry="13" fill="#efe2cc"/><ellipse cx="36" cy="55" rx="7.5" ry="6.5" fill="#bfe3f2"/><ellipse cx="64" cy="55" rx="7.5" ry="6.5" fill="#bfe3f2"/><ellipse cx="37" cy="57" rx="2.2" ry="4" fill="#1d1d1d"/><ellipse cx="63" cy="57" rx="2.2" ry="4" fill="#1d1d1d"/><polygon points="24,41 47,41 47,59 24,50" fill="#b08d68"/><polygon points="76,41 53,41 53,59 76,50" fill="#b08d68"/><path d="M24 50 L47 59 M76 50 L53 59" stroke="#4a3624" stroke-width="2" stroke-linecap="round"/><polygon points="44.5,65 55.5,65 50,71 " fill="#d98a8a"/><path d="M35 86 Q41 72 50 75 Q59 72 65 86" fill="none" stroke="#3b2a1b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 71 L50 75" stroke="#3b2a1b" stroke-width="2" stroke-linecap="round"/></svg></div>
  <h1>Zsémbmonitor</h1>
  <div id="content" aria-live="polite">
    <form id="form">
      <label><input type="checkbox" id="twin"> Ikerkedvezmény</label>
      <button type="submit">Előfizetek</button>
    </form>
  </div>
</main>
<script>
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var twin = document.getElementById('twin').checked;
    var p = document.createElement('p');
    p.className = 'result';
    p.textContent = '✓ Előfizetve ' + (twin ? 'ikerkedvezménnyel' : 'ikerkedvezmény nélkül');
    document.getElementById('content').replaceChildren(p);
  });
</script>
</body>
</html>
